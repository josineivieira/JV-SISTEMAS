databases:
  - name: jv-sistemas-db
    databaseName: jv_sistemas
    user: jv_sistemas_user

services:
  - type: web
    name: jv-sistemas-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jv-sistemas-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://jv-sistemas-frontend.onrender.com

  - type: web
    name: jv-sistemas-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_APP_NAME
        value: JV Sistemas & Tecnologia
      - key: NEXT_PUBLIC_APP_VERSION
        value: 1.0.0
      - key: NEXT_PUBLIC_API_URL
        value: https://jv-sistemas-backend.onrender.com/api
